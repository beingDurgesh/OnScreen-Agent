name: build-apk
on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - name: Install Rust (agent-core tests + JNI)
        uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - name: Rust tests (RAM-budget logic)
        working-directory: rust/agent-core
        run: cargo test --release
      - name: Build JNI lib (arm64)
        working-directory: rust/agent-core
        run: |
          cargo ndk --target aarch64-linux-android --platform 35 -- build --release || \
          cargo build --release
          mkdir -p ../../app/src/main/jniLibs/arm64-v8a
          cp target/*/release/libagent_core.so ../../app/src/main/jniLibs/arm64-v8a/ 2>/dev/null || echo "jni .so missing, app runs with Kotlin fallback"
      - name: Assemble cloud debug APK
        run: |
          chmod +x gradlew || (curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/g.zip && unzip -q /tmp/g.zip -d /tmp && /tmp/gradle-8.9/bin/gradle :app:assembleDebug)
          ./gradlew :app:assembleDebug --stacktrace || gradle :app:assembleDebug --stacktrace
      - name: SHA + artifact
        run: sha256sum app/build/outputs/apk/debug/*.apk | tee SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: on-screen-cloud-arm64-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            SHA256.txt
