name: build-apk
on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973'
      - name: Install Rust (agent-core tests + JNI)
        uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Rust tests (RAM-budget logic)
        working-directory: rust/agent-core
        run: cargo test --release
      - name: Build JNI lib (arm64)
        working-directory: rust/agent-core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          cargo ndk --target aarch64-linux-android --platform 35 -- build --release
          mkdir -p ../../app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/arm64-v8a/release/libagent_core.so ../../app/src/main/jniLibs/arm64-v8a/
      - name: Assemble cloud debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: SHA + artifact
        run: sha256sum app/build/outputs/apk/debug/*.apk | tee SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: on-screen-cloud-arm64-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            SHA256.txt
