name: release-testing-apk
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testing-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - name: Rust tests
        working-directory: rust/agent-core
        run: cargo test --release
      - name: JNI lib (best effort)
        working-directory: rust/agent-core
        run: |
          cargo ndk --target aarch64-linux-android --platform 35 -- build --release || cargo build --release
          mkdir -p ../../app/src/main/jniLibs/arm64-v8a
          cp target/*/release/libagent_core.so ../../app/src/main/jniLibs/arm64-v8a/ 2>/dev/null || echo "no .so, Kotlin fallback active"
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Rename + hash
        run: |
          TAG="${GITHUB_REF_NAME:-manual}"
          OUT="OnScreen-Agent-${TAG}-testing.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$OUT"
          sha256sum "$OUT" | tee SHA256.txt
      - name: Publish testing pre-release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            OnScreen-Agent-*-testing.apk
            SHA256.txt
