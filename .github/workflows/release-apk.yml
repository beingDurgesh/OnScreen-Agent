name: release-testing-apk
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testing-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973'
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Rust tests
        working-directory: rust/agent-core
        run: cargo test --release
      - name: JNI lib
        working-directory: rust/agent-core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          cargo ndk --target aarch64-linux-android --platform 35 -- build --release
          mkdir -p ../../app/src/main/jniLibs/arm64-v8a
          # cargo-ndk's output path varies by version; match on aarch64 so the
          # host build from `cargo test` is never picked up by mistake.
          SO="$(find target -type f -name libagent_core.so -path '*aarch64*' | head -n 1)"
          echo "JNI lib: $SO"
          test -n "$SO"
          cp "$SO" ../../app/src/main/jniLibs/arm64-v8a/
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Rename + hash
        run: |
          TAG="${GITHUB_REF_NAME:-manual}"
          OUT="OnScreen-Agent-${TAG}-testing.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$OUT"
          sha256sum "$OUT" | tee SHA256.txt
      - name: Publish testing pre-release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            OnScreen-Agent-*-testing.apk
            SHA256.txt
