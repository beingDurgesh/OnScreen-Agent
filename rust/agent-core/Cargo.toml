[package]
name = "agent-core"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# On-device weights are NEVER bundled. These only enable download-and-mmap paths.
ondevice-stt = ["dep:whisper-rs"]
ondevice-tts = ["dep:ort"]
ondevice-vlm = []

[dependencies]
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = { version = "1", features = ["union", "serde"] }
whisper-rs = { version = "0.12", optional = true }
# ort has no stable 2.x on crates.io (only 2.0.0-rc.* pre-releases), so a bare
# "2" requirement is unresolvable and breaks resolution even with the feature off.
ort = { version = "2.0.0-rc.15", optional = true, default-features = false, features = ["download-binaries"] }

[profile.release]
opt-level = "z"      # min size -> less RAM/pages
lto = true
strip = "symbols"
codegen-units = 1
panic = "unwind"     # required for JNI; do not set abort

[profile.release.package."*"]
opt-level = "z"
